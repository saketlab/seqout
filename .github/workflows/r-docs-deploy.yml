name: r-docs-deploy

on:
  push:
    branches: [main, master]
    paths:
      - "R/**"
      - "!R/tests/**"
      - ".github/workflows/r-docs-deploy.yml"
  workflow_dispatch:

concurrency:
  group: r-docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      MAKEFLAGS: -j4
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R
          extra-packages: any::pkgdown
          needs: website
          cache: always

      # counts.Rmd pulls a GEO payload into tools::R_user_dir("seqout", "cache").
      # Keyed on the vignettes so it refreshes when they change; restore-keys
      # still reuses the old copy meanwhile, since payloads are keyed by accession.
      - name: Cache what the vignettes download
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/seqout
          key: seqout-vignette-data-${{ hashFiles('R/vignettes/**/*.Rmd') }}
          restore-keys: seqout-vignette-data-

      - name: Build the site
        working-directory: R
        run: |
          R CMD INSTALL . --no-byte-compile
          Rscript -e 'pkgdown::build_site(preview = FALSE, install = FALSE, new_process = FALSE)'

      - name: The build has to have produced a landing page
        run: test -f R/docs/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: r-site
          path: R/docs/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r-site
          path: site

      - name: Make room for the new release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script: |
            set -e
            cd /var/www/sramap/seqoutDB/R
            rm -rf site-incoming
            mkdir -p site-incoming site-releases

      - name: Upload the built site
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          source: "site/*"
          target: /var/www/sramap/seqoutDB/R/site-incoming
          strip_components: 1

      - name: Swap it in
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /var/www/sramap/seqoutDB/R

            test -f site-incoming/index.html || {
              echo "::error::upload has no index.html; refusing to swap"
              exit 1
            }

            release="site-releases/${{ github.sha }}-${{ github.run_id }}"
            rm -rf "$release"
            mv site-incoming "$release"

            previous=$(readlink site || true)

            if [ ! -L site ] && [ -e site ]; then
              rm -rf site.prepared
              mv site site.prepared
            fi

            ln -sfn "$release" site.new
            mv -T site.new site
            rm -rf site.prepared

            code=$(curl -sk -o /dev/null -w '%{http_code}' \
                     -H 'Host: seqout.org' https://127.0.0.1/cli/R/ || true)
            if [ "$code" != "200" ]; then
              if [ -n "$previous" ] && [ -d "$previous" ]; then
                ln -sfn "$previous" site.new
                mv -T site.new site
                echo "::error::/cli/R/ answered $code; rolled back to $previous"
              else
                echo "::error::/cli/R/ answered $code and there is nothing to roll back to"
              fi
              exit 1
            fi

            live=$(readlink site)
            for old in $(ls -1dt site-releases/*/ 2>/dev/null | tail -n +6); do
              [ "${old%/}" = "$live" ] || rm -rf "$old"
            done
            echo "deployed $release"
