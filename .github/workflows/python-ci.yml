name: python-ci

on:
  push:
    branches: [main, master]
    paths:
      - "python/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-ci.yml"

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13", "3.14"]
        install: [counts]
        include:
          # the base install proves the counts extra stays optional
          - { os: ubuntu-latest, python: "3.13", install: base }
    name: test (${{ matrix.os }}, py${{ matrix.python }}, ${{ matrix.install }})
    env:
      UV_PYTHON: ${{ matrix.python }}
    defaults:
      run:
        working-directory: python
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - run: uv sync ${{ matrix.install == 'counts' && '--extra counts' || '' }}
      - run: uv run python scripts/check_imports.py --${{ matrix.install }}

      - run: uv run pytest -m "not network"

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --extra counts
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
