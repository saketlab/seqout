[project]
name = "seqout"
version = "0.1.2"
description = "Python API and CLI client to interact with seqout.org"
readme = "README.md"
authors = [
    { name = "Mukesh Reddy", email = "mukeshreddy.work@gmail.com" },
    { name = "Aniruddha Mukherjee", email = "amkhrjee@iitb.ac.in" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.4",
    "httpx>=0.28.1",
    "langchain>=1.3.9",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "tqdm>=4.67.3",
]

[project.scripts]
seqout = "seqout.cli.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/seqout"]

[tool.setuptools.package-data]
seqout = ["py.typed"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "BLE001",
    "C901", "COM812",
    "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D203", "D212",
    "EM102",
    "FBT001",
    "PLR0913", "PLR0912", "PLR0915",
    "TRY003", "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLC0415", "INP001", "D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
markers = ["network: hits the live seqout.org API; skips when unreachable"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupytext>=1.19.5",
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "pytest>=9.0.3",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.20",
]
