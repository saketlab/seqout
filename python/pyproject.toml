[project]
name = "seqout"
version = "0.2.3"
description = "Search genomics study metadata across GEO, SRA, ENA, DDBJ, ArrayExpress, GEA and GSA, and read GEO supplementary files as counts matrices"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
    "genomics", "bioinformatics", "metadata", "single-cell",
    "GEO", "SRA", "ENA", "DDBJ", "ArrayExpress", "GSA",
    "accession", "counts matrix", "duckdb", "parquet",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
authors = [
    { name = "Mukesh Reddy", email = "mukeshreddy.work@gmail.com" },
    { name = "Aniruddha Mukherjee", email = "amkhrjee@iitb.ac.in" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.4",
    "httpx>=0.28.1",
    "langchain>=1.3.9",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "questionary>=2.1.1",
    "requests>=2.32",
    "rich>=15.0.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
counts = ["anndata>=0.10", "h5py>=3.11", "isal>=1.6", "rdata>=0.11", "scipy>=1.14"]

[project.urls]
Homepage = "https://seqout.org"
Documentation = "https://seqout.org/cli/python/"
Repository = "https://github.com/saketlab/seqout"
Issues = "https://github.com/saketlab/seqout/issues"

[project.scripts]
seqout = "seqout.cli.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/seqout"]

[tool.setuptools.package-data]
seqout = ["py.typed"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "BLE001",
    "C901", "COM812",
    "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D203", "D212",
    "EM102",
    "FBT001",
    "PLR0913", "PLR0912", "PLR0915",
    "TRY003", "TRY301",
]

[tool.ruff.lint.per-file-ignores]
# A test exists to poke at internals with literal values, so the rules that
# guard a public API's shape do not apply to one.
"tests/**" = [
    "S101", "ANN", "PLC0415", "INP001", "D",
    "ARG",      # a stub's signature has to match what it stands in for
    "PLR2004",  # the expected value is the point of the assertion
    "PTH123",   # open() on a throwaway path reads fine
    "SLF001",   # mocking _sender is how a client gets tested offline
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
markers = ["network: hits the live seqout.org API; skips when unreachable"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupytext>=1.19.5",
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.27",
    "pytest>=9.0.3",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.20",
]
