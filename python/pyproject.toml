[project]
name = "seqoutdb"
version = "0.1.2"
description = "Python API and CLI client to interact with seqout.org"
readme = "README.md"
authors = [
    { name = "Mukesh", email = "mukeshreddy.work@gmail.com" },
    { name = "Aniruddha Mukherjee", email = "amkhrjee@iitb.ac.in" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.3.9",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "tqdm>=4.67.3",
]

[project.scripts]
seqoutdb = "seqoutdb.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/seqoutdb"]

[tool.setuptools.package-data]
seqoutdb = ["py.typed"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "pytest-httpx>=0.36.2",
]
