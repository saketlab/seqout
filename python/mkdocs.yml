site_name: seqout
site_url: https://seqout.org/cli/
site_description: Python library and command-line client for seqout.org
docs_dir: docs
repo_url: https://github.com/saketlab/seqout 
repo_name: saketlab/seqout

# The .py files are the editable source of the example notebooks (jupytext
# percent format). The committed .ipynb (with outputs) are what the site renders.
exclude_docs: |
  examples/*.py

theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Geist
    code: Geist Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

plugins:
  - search
  - mkdocs-jupyter:
      execute: false

extra:
  social:
    - icon: fontawesome/regular/building
      link: https://saketlab.org
      name: Saket Lab 

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Command line: cli.md
  - Metadata normalization: normalization.md
  - Python library: library.md
  - Parquet backend: parquet.md
  - Examples:
      - Overview: examples/index.md
      - Command-line examples: examples/command-line.md
      - Getting started: examples/01_getting_started.ipynb
      - Working with a dataset: examples/02_working_with_a_dataset.ipynb
      - Accessions and archives: examples/03_accessions_and_archives.ipynb
      - Offline with Parquet: examples/04_offline_with_parquet.ipynb
