site_name: seqoutdb
site_description: Python library and command-line client for seqout.org
docs_dir: docs

theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  font:
    text: Geist
    code: Geist Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Command line: cli.md
  - Enriched metadata: metadata-ai.md
  - Python library: library.md
  - Parquet backend: parquet.md
