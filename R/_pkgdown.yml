url: https://seqout.org/cli/R

development:
  mode: auto

template:
  bootstrap: 5
  light-switch: true
  preset: default
  includes:
    in_header: |
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-7MHP1LW5FD"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-7MHP1LW5FD');
      </script>
      <meta name="keywords" content="seqout, R package, GEO, SRA, ENA, ArrayExpress, DDBJ, GSA, genomics metadata, single-cell, counts matrix, DuckDB, Parquet">
      <link rel="alternate" type="text/plain" href="https://seqout.org/cli/llms.txt" title="llms.txt">
      <meta name="author" content="Saket Choudhary">
      <meta property="og:type" content="website">
      <meta property="og:site_name" content="seqout">
      <meta property="og:locale" content="en_US">
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "seqout",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Windows, macOS, Linux",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "R client for the Seqout genomics metadata database, covering NCBI GEO, SRA, ENA, ArrayExpress, DDBJ and GSA, with counts-matrix readers for GEO supplementary files",
        "author": {
          "@type": "Person",
          "name": "Saket Choudhary",
          "url": "https://saketlab.org"
        },
        "url": "https://seqout.org/cli/R",
        "codeRepository": "https://github.com/saketlab/seqout",
        "license": "https://opensource.org/licenses/MIT",
        "softwareVersion": "0.2.1",
        "programmingLanguage": "R"
      }
      </script>

  opengraph:
    image:
      src: man/figures/og-image.png
      alt: seqout R package documentation

home:
  title: "Genomics datasets with R"
  description: >
    Query study metadata from NCBI GEO, SRA, ENA, ArrayExpress, DDBJ and GSA,
    resolve accessions across archives, and read GEO supplementary files as
    counts matrices.

  links:
  - text: Python client
    href: https://seqout.org/cli/python/
  - text: Report a bug
    href: https://github.com/saketlab/seqout/issues

navbar:
  structure:
    left:  [get_started, reference, articles, news]
    right: [search, lightswitch, github, website]

  components:
    get_started:
      text: Get Started
      href: articles/getting-started.html

    reference:
      text: Reference
      href: reference/index.html

    github:
      icon: fab fa-github fa-lg
      href: https://github.com/saketlab/seqout
      aria-label: GitHub

    website:
      text: Saket Lab
      href: https://saketlab.in/

articles:
- title: Guides
  navbar: ~
  contents:
  - getting-started
  - articles/search
  - articles/metadata
  - articles/counts
  - articles/downloads
  - articles/citations

reference:
- title: Connecting
  desc: Pick a backend (REST or Parquet) and work with the local DuckDB cache
  contents:
  - seqout_connect
  - seqout_default
  - seqout_close
  - tables
  - register_tables
  - cache_table
  - clear_cache
  - query

- title: Searching
  desc: Free-text and structured search across every archive
  contents:
  - seqout_search
  - sample_search
  - project_single_cell
  - sample_microbes

- title: Datasets
  desc: >
    One accession and everything below it. `SeqoutGet()` returns a lazy
    object whose fields -- samples, runs, publications, links -- are fetched
    on first use.
  contents:
  - seqout_get
  - accession_kind
  - summaries

- title: Counts matrices
  desc: Read GEO supplementary files as a counts matrix
  contents:
  - seqout_counts
  - manifest
  - seqout_units
  - seqout_matrix
  - counts_matrix
  - matrices
  - bind_counts
  - quick_annotation
  - seqout_counts_files
  - file_role
  - group_key
  - is_filtered

- title: Downloads
  desc: Fetch supplementary files, sequencing reads and alignments
  contents:
  - download_supplementary
  - download_runs
  - download_bams
  - download_dump

- title: Publications
  desc: Papers linked to studies, and studies linked to papers
  contents:
  - citations
  - paper
  - author

- title: Package
  contents:
  - seqout-package

authors:
  Saket Choudhary:
    href: https://saket-choudhary.me/
  Aniruddha Mukherjee:
    href: https://amkhrjee.in/
  Mukesh Reddy:
    href: https://0xmukesh.github.io/

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: "Developed by [Saket Lab](https://saketlab.org)"
    built_with: "Built with [pkgdown](https://pkgdown.r-lib.org/)"
